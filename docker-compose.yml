
services:
  db: 
    image: postgres:16
    environment:
      POSTGRES_DB: webhook_db
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: webhook_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  web:
    build: .
    # command: gunicorn Webhook_Catcher.wsgi:application --bind 127.0.0.0:8000
    # volumes:
    #   - .:/Django Project/Django-Webhook_Catcher
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: webhook_db
      DB_USER: webhook_user
      DB_PASSWORD: webhook_pass
      DB_HOST: db
      DB_PORT: 5432
    develop:
      watch: 
        - action: sync
          path: .
          target: /Django-Webhook_Catcher/webhooks/templates

volumes:
  postgres_data: