<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Http Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
:root{
    --text: #050316;
    --background: #fbfbfe;
    --primary: #68649c;
    --secondary: #b9a7c7;
    --accent: #ac8ab5;
}

.dark-mode{
    --text: #eae9fc;
    --background: #010104;
    --primary: #67639c;
    --secondary: #493857;
    --accent: #6b4974;
}

body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--background);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    transition: all 0.3s ease;
}

.main-container{
    width: 550px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    border-radius: 16px;
    background-color: var(--background);
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    transition: all 0.3s ease;
}

.card-title{
    text-align: center;
    font-size: 2.2rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text);
}

.details{
    border: 1px solid var(--primary);
    padding: 22px;
    border-radius: 12px;
    background-color: var(--background);
}

.detail{
    margin-bottom: 14px;
    font-size: 1.05rem;
    line-height: 1.5;
    word-break: break-word;
    color: var(--text);
}

label{
    font-weight: 700;
    color: var(--primary);
    margin-right: 6px;
}

.dash-btn{
    display: flex;
    justify-content: center;
    margin-top: 10px;
}

.btn{
    padding: 14px 32px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background-color: var(--primary);
    color: var(--background);
    transition: all 0.2s ease;
}

.btn:hover{
    background-color: var(--accent);
    transform: translateY(-2px);
}

.theme-btn{
    position: fixed;
    top: 20px;
    right: 20px;
    width: 52px;
    height: 52px;
    border: none;
    background-color: var(--background);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.theme-btn:hover{
    transform: scale(1.05);
}

.dark-mode-icon{
    font-size: 1.3rem;
}
</style>
<body>
    <button class="theme-btn" onclick="toggleDarkMode()"></button>
    <div class="main-container card">
        <div class="card-title">Webhook Received Successfully</div>
        <div class="details">
            {% for req in records %}
                <div class="detail"><label for="">Request Id: </label>{{ req.id }}</div>
                <div class="detail"><label for="">Method: </label>{{ req.http_method }}</div>
                <div class="detail"><label for="">Path: </label>{{ req.path }}</div>
                <div class="detail"><label for="">Timestamp: </label>{{ req.timestamp }}</div>
                <div class="detail"><label for="">Query Parameters</label>{}</div>
            {% endfor %}
        </div>
        <div class="dash-btn"><button type="submit" class="btn">Go To Dashboard</button></div>
    </div>
<script>
    window.onload = function(){
        const savedTheme = localStorage.getItem("theme")

        if (savedTheme === "dark"){
            changeThemeIcon(true)
            document.body.classList.add("dark-mode")
        }
        else{
            changeThemeIcon(false)
        }
    };

    function toggleDarkMode(){
        let dark_theme = document.body.classList.contains("dark-mode")

        if (dark_theme === false){
            document.body.classList.toggle("dark-mode")
            changeThemeIcon(!dark_theme)
            localStorage.setItem("theme", "dark")
        }
        else{
            document.body.classList.remove("dark-mode")
            changeThemeIcon(!dark_theme)
            localStorage.setItem("theme", "light")
        }
        dark_theme != dark_theme
    }

    function changeThemeIcon(dark_mode){
        console.log("changing Icon")
        let btn_space = document.querySelector(".theme-btn")
        if (dark_mode === true){
            btn_space.innerHTML = '<i class="dark-mode-icon bi bi-moon-fill fs-3" onclick="toggleDarkMode()"></i>'
        }
        else if (dark_mode === false){
            btn_space.innerHTML = '<i class="dark-mode-icon bi bi-brightness-high-fill fs-3" onclick="toggleDarkMode()"></i>'
        }
    }
</script>
</body>
</html>
