<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Http Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<style>
    .main-container{
        margin-top: 10%;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1.7px solid black;
        flex-direction: column;
        
    }

    .card-title{
        margin-top: 7px;
        font-size: 2rem;
    }

    .details{
        border: 1px solid black;
    }
</style>
<body>
    <div class="main-container card">
        <div class="card-title">Webhook Received Successfully</div>
        <div class="details">
            {% for req in records %}
                <div class="detail"><label for="">Request Id: </label>{{ req.id }}</div>
                <div class="detail"><label for="">Method: </label>{{ req.http_method }}</div>
                <div class="detail"><label for="">Path: </label>{{ req.path }}</div>
                <div class="detail"><label for="">Timestamp: </label>{{ req.timestamp }}</div>
                <div class="detail"><label for="">Query Parameters</label>{}</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
