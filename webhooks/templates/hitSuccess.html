<!DOCTYPE html>
<html>
<head>
    <title>Request Success</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            background: #ebfff1;
            font-family: Arial;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid #017e23;
            position: relative;
            animation: scaleIn 0.3s ease-in-out;
        }

        .checkmark::after {
            content: '';
            position: absolute;

            top: 50%;
            left: 50%;

            width: 25px;
            height: 50px;

            border-right: 5px solid #017e23;
            border-bottom: 5px solid #017e23;

            transform: translate(-50%, -60%) rotate(45deg);

            animation: draw 0.5s ease forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes draw {
            from {
                width: 0;
                height: 0;
            }
            to {
                width: 25px;
                height: 50px;
            }
        }

        .message {
            margin-top: 20px;
            font-size: 20px;
            color: #017e23;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark"></div>
        <div class="message">Request Received Successfully</div>
    </div>
</body>
</html>
