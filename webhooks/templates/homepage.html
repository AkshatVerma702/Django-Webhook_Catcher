{% load bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webhook Catcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    {% bootstrap_css %}
</head>

<style>
    :root{
        --text: #050316;
        --background: #fbfbfe;
        --primary: #68649c;
        --secondary: #b9a7c7;
        --accent: #ac8ab5;
    }

    .dark-mode{
        --text: #eae9fc;
        --background: #010104;
        --primary: #67639c;
        --secondary: #493857;
        --accent: #6b4974;
    }
    
    body{
        background-color: var(--background);
        color: var(--text);
    }

    .main-container{
        margin-top: 120px;
    }

    .main-text{
        margin-bottom: 100px;
        font-size: 70px;
        color: var(--text);
    }

    .sub-text{
        color: var(--text);
        opacity: 0.7;
    }

    .btn-primary{
        background-color: var(--primary);
        border-color: var(--primary);
    }

    .btn-success{
        background-color: var(--accent);
        border-color: var(--accent);
    }

    .btn-outline-secondary{
        color: var(--text);
        border-color: var(--text);
    }

    .btn-outline-secondary:hover{
        background-color: var(--secondary);
        color: #000;
    }

    .theme{
        background-color: var(--background);
        color: var(--text);
    }

    input.form-control{
        background-color: var(--background);
        color: var(--text);
        border: 1px solid var(--primary);
    }

    input.form-control:focus{
        box-shadow: none;
        border-color: var(--accent);
    }
</style>

<body>
<div class="theme-container d-flex flex-row-reverse m-1">
    <button class="theme border-0"></button>
</div>

<div class="container text-center py-5 main-container">
    <h1 class="fw-bold mb-3 col-sm main-text">
        Webhook Catcher
    </h1>

    <p class="fs-5 sub-text">
        Generate webhook URLs and inspect incoming HTTP requests in real time.
    </p>

    <div class="mt-5">
        <a href="/view/allrequests/" class="btn btn-primary btn-lg me-3">
            Open Dashboard
        </a>

        <button class="btn btn-success btn-lg" onclick="createDynamicRoute()">
            Generate Webhook
        </button>
    </div>

    <div id="webhook-container" class="mt-4 d-none">
        <label class="form-label fw-semibold">Your Webhook URL</label>

        <div class="input-group w-50 mx-auto">
            <input type="text" id="webhook-url" class="form-control" readonly>

            <button class="btn btn-outline-secondary" onclick="copyWebhook()">
                Copy
            </button>
        </div>
    </div>
</div>
</body>

<script>

window.onload = function(){
    const savedTheme = localStorage.getItem("theme")

    if (savedTheme === "dark"){
        changeThemeIcon(true)
        document.body.classList.add("dark-mode")
    }
    else{
        changeThemeIcon(false)
    }
    
};

async function createDynamicRoute(){

    const response = await fetch("/catch/request/", {
        method: "POST"
    });

    const data = await response.json();

    const webhookUrl = data.url || `/catch/request/${data.token}/`;

    const container = document.getElementById("webhook-container");
    const input = document.getElementById("webhook-url");

    input.value = window.location.origin + webhookUrl;
    container.classList.remove("d-none");
}

function copyWebhook(){
    const input = document.getElementById("webhook-url");
    navigator.clipboard.writeText(input.value);
}

function changeThemeIcon(dark_mode){
    // <i class="bi bi-brightness-high-fill" onclick="toggleDarkMode()"></i> light icon
    // <i class="dark-mode-icon bi bi-moon-fill fs-3" onclick="toggleDarkMode()"></i> dark icon
    console.log("changing Icon")
    let btn_space = document.querySelector(".theme")
    if (dark_mode === true){
        btn_space.innerHTML = '<i class="dark-mode-icon bi bi-moon-fill fs-3" onclick="toggleDarkMode()"></i>'
    }
    else if (dark_mode === false){
        btn_space.innerHTML = '<i class="dark-mode-icon bi bi-brightness-high-fill fs-3" onclick="toggleDarkMode()"></i>'
    }
}

function toggleDarkMode(){
    let dark_theme = document.body.classList.contains("dark-mode")

    if (dark_theme === false){
        document.body.classList.toggle("dark-mode")
        changeThemeIcon(!dark_theme)
        localStorage.setItem("theme", "dark")
    }
    else{
        document.body.classList.remove("dark-mode")
        changeThemeIcon(!dark_theme)
        localStorage.setItem("theme", "light")
    }
    dark_theme != dark_theme
}
</script>

{% bootstrap_javascript %}

</body>
</html>
