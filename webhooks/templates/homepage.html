{% load bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webhook Catcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    {% bootstrap_css %}
</head>

<style>
    
    .main-container{
        margin-top: 120px;
    }

    .main-text{
        padding-top: 0px;
        margin-bottom: 100px;
        font-size: 70px;
    }
</style>

<body class="bg-light">
<div class="theme-container d-flex flex-row-reverse m-1">
    <button class="theme border-0 bg-white"><i class="dark-mode-icon bi bi-moon-fill fs-3"></i></button>
</div>
<div class="container text-center py-5 main-container">
    <h1 class="fw-bold mb-3 col-sm main-text">
        Webhook Catcher
    </h1>

    <p class="text-muted fs-5">
        Generate webhook URLs and inspect incoming HTTP requests in real time.
    </p>

    <div class="mt-5">

        <a href="/view/allrequests/" class="btn btn-primary btn-lg me-3">
            Open Dashboard
        </a>

        <button class="btn btn-success btn-lg" onclick="createDynamicRoute()">
            Generate Webhook
        </button>

    </div>

    <div id="webhook-container" class="mt-4 d-none">
        <label class="form-label fw-semibold">Your Webhook URL</label>

        <div class="input-group w-50 mx-auto">
            <input type="text" id="webhook-url" class="form-control" readonly>

            <button class="btn btn-outline-secondary" onclick="copyWebhook()">
                Copy
            </button>
        </div>
    </div>

</div>

<script>
async function createDynamicRoute(){

    const response = await fetch("/catch/request/", {
        method: "POST"
    });

    const data = await response.json();

    const webhookUrl = data.url || `/catch/request/${data.token}/`;

    const container = document.getElementById("webhook-container");
    const input = document.getElementById("webhook-url");

    input.value = window.location.origin + webhookUrl;
    container.classList.remove("d-none");
}

function copyWebhook(){
    const input = document.getElementById("webhook-url");
    navigator.clipboard.writeText(input.value);
}

function manageTheme(){

}
</script>

{% bootstrap_javascript %}

</body>
</html>
